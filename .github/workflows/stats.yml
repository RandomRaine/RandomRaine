name: Generate stats SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          path: github-stats

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: github-stats/requirements.txt

      - name: Install requirements
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r github-stats/requirements.txt

      - name: Generate stats images
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: RandomRaine
          EXCLUDED_LANGS: "HTML,CSS,Roff,Dockerfile,Shell,TeX,Makefile"
          EXCLUDE_FORKED_REPOS: "true"
        run: |
          cd github-stats
          python3 --version
          python3 generate_images.py

      - name: Commit and push
        run: |
          mkdir -p generated
          cp -v github-stats/generated/* generated/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate stats SVGs"
            git push
          else
            echo "No stats changes to commit."
          fi
